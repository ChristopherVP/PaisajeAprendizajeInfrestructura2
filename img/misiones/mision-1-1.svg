"140" y1="52" x2="140" y2="32" stroke="#ff8a1f" stroke-width="3" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" values="-50 140 52;50 140 52;-50 140 52" dur="3s" repeatCount="indefinite"/></line><text class="t" x="140" y="88">QoS</text></g><g data-h="2" tabindex="0" role="button" aria-label="QoE"><circle class="n" cx="350" cy="45" r="24"/><circle cx="342" cy="40" r="2.5" fill="#d9f6ff"/><circle cx="358" cy="40" r="2.5" fill="#d9f6ff"/><path d="M340 52Q350 62 360 52" fill="none" stroke="#3dff9a" stroke-width="3" stroke-linecap="round"><animate attributeName="d" values="M340 52Q350 62 360 52;M340 56Q350 56 360 56;M340 52Q350 62 360 52" dur="4s" repeatCount="indefinite"/></path><text class="t" x="350" y="88">QoE</text></g></svg>