e="opacity" dur="4s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.55;0.551;0.8;0.801;1"/></circle></g><g data-h="2" tabindex="0" role="button" aria-label="Pérdida de paquetes"><rect class="n" x="10" y="136" width="380" height="48" rx="8" style="fill-opacity:.5"/><text class="t" x="48" y="164">Pérdida</text><path class="l" d="M90 160H370" style="stroke:#19e6ff"/><circle r="5" fill="#ff3b5c" opacity="0"><animateMotion dur="4s" repeatCount="indefinite" path="M90 160H230" keyPoints="0;0;1;1" keyTimes="0;0.0;0.4;1" calcMode="linear"/><animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0;0.001;0.4;0.401;1"/></circle><text class="t bl" x="240" y="165">✖</text><circle r="5" fill="#19e6ff" opacity="0"><animateMotion dur="4s" repeatCount="indefinite" path="M90 160H370" keyPoints="0;0;1;1" keyTimes="0;0.5;0.95;1" calcMode="linear"/><animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5;0.501;0.95;0.951;1"/></circle></g></svg>