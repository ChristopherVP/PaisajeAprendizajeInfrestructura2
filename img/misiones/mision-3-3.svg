oke="#3dff9a" stroke-width="2" stroke-dasharray="5 4" fill="none"/><circle r="6" fill="#3dff9a" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" path="M70 134L330 154" keyPoints="0;0;1;1" keyTimes="0;0.6;0.82;1" calcMode="linear"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6;0.601;0.82;0.821;1"/></circle><rect class="n" x="165" y="136" width="70" height="18" rx="5"/><text class="s" x="200" y="149">ACK</text></g><g class="bl"><text class="s" x="200" y="182">✔ Conexión establecida</text></g></svg>