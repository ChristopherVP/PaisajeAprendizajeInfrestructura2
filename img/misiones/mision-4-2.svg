rcle></g><g data-h="3" tabindex="0" role="button" aria-label="Azure Monitor"><rect class="n" x="210" y="106" width="175" height="74" rx="8"/><text class="t" x="297.5" y="142.0">Azure Monitor</text><text class="s" x="297.5" y="154.0">recursos en la nube</text><circle r="4" fill="#d9f6ff" opacity="0"><animateMotion dur="3.7s" repeatCount="indefinite" path="M222 168H373" keyPoints="0;0;1;1" keyTimes="0;0.0;1.0;1" calcMode="linear"/><animate attributeName="opacity" dur="3.7s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0;0.001;1"/></circle></g></svg>