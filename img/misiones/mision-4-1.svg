ico</text></g><g data-h="2" tabindex="0" role="button" aria-label="Aire acondicionado"><rect x="184" y="30" width="62" height="132" rx="8" fill="#0a2233" fill-opacity=".01" class="n" style="fill-opacity:.35"/><g><animateTransform attributeName="transform" type="rotate" from="0 215 95" to="360 215 95" dur="6s" repeatCount="indefinite"/><line x1="215" y1="65" x2="215" y2="125" stroke="#19e6ff" stroke-width="3" transform="rotate(0 215 95)"/><line x1="215" y1="65" x2="215" y2="125" stroke="#19e6ff" stroke-width="3" transform="rotate(60 215 95)"/><line x1="215" y1="65" x2="215" y2="125" stroke="#19e6ff" stroke-width="3" transform="rotate(120 215 95)"/></g><circle class="n" cx="215" cy="95" r="8"/><text class="s" x="215" y="180">Clima</text></g><g data-h="3" tabindex="0" role="button" aria-label="Seguridad"><rect x="259" y="30" width="62" height="132" rx="8" fill="#0a2233" fill-opacity=".01" class="n" style="fill-opacity:.35"/><path class="n" d="M290 60L316 70V98C316 114 302 124 290 130C278 124 264 114 264 98V70Z"/><path d="M279 96L288 105L303 86" fill="none" stroke="#3dff9a" stroke-width="4"/><text class="s" x="290" y="180">Seguridad</text></g><g data-h="4" tabindex="0" role="button" aria-label="Telecomunicaciones"><rect x="324" y="30" width="62" height="132" rx="8" fill="#0a2233" fill-opacity=".01" class="n" style="fill-opacity:.35"/><line x1="355" y1="130" x2="355" y2="80" stroke="#19e6ff" stroke-width="4"/><path class="n" d="M347 76Q355 62 363 76" style="fill:none"><animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="0.0s" repeatCount="indefinite"/></path><path class="n" d="M340 73Q355 55 370 73" style="fill:none"><animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="0.3s" repeatCount="indefinite"/></path><path class="n" d="M333 69Q355 48 377 69" style="fill:none"><animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="0.6s" repeatCount="indefinite"/></path><text class="s" x="355" y="180">Telecom.</text></g></svg>