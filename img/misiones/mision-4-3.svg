<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="Series de tiempo y la nube"><style>
.n{fill:#0a2233;stroke:#19e6ff;stroke-width:2}
.t{fill:#d9f6ff;font:700 10px Orbitron,system-ui,sans-serif;text-anchor:middle;pointer-events:none}
.s{fill:#7fa8b8;font:9px system-ui,sans-serif;text-anchor:middle;pointer-events:none}
.l{fill:none;stroke:#19e6ff;stroke-opacity:.55;stroke-width:2;stroke-dasharray:6 4;animation:sv-d 1s linear infinite}
@keyframes sv-d{to{stroke-dashoffset:-20}}
.bl{animation:sv-b 1s steps(2) infinite}
@keyframes sv-b{50%{opacity:.2}}
.sh{animation:sv-s .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center top}
@keyframes sv-s{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
[data-h]{cursor:pointer;outline:none}
[data-h]:hover .n,[data-h]:focus .n,[data-h].on .n{stroke:#ff8a1f;fill:#3a2208}
[data-h].on{filter:drop-shadow(0 0 6px #ff8a1f)}
</style><defs><pattern id="g43" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#19e6ff" stroke-opacity=".12"/><animateTransform attributeName="patternTransform" type="translate" from="0 0" to="20 0" dur="2s" repeatCount="indefinite"/></pattern></defs><rect width="400" height="200" fill="#04101c"/><rect width="400" height="200" fill="url(#g43)"/><g data-h="0" tabindex="0" role="button" aria-label="Serie de tiempo"><rect class="n" x="15" y="20" width="190" height="150" rx="8"/><path d="M30 150H195M30 150V35" stroke="#7fa8b8" fill="none"/><path d="M32 135L58 112L84 122L112 80L140 92L168 54L192 62" fill="none" stroke="#3dff9a" stroke-width="3" stroke-dasharray="220" stroke-dashoffset="220"><animate attributeName="stroke-dashoffset" values="220;0;0" keyTimes="0;.7;1" dur="4s" repeatCount="indefinite"/></path><text class="s" x="110" y="165">métrica en el tiempo</text></g><g data-h="1" tabindex="0" role="button" aria-label="Nube"><path class="n" d="M255 80C235 80 235 56 257 56C260 36 290 34 298 52C320 50 326 80 306 80Z"/><text class="s" x="280" y="72">Azure</text><circle r="4" fill="#ff8a1f" opacity="0"><animateMotion dur="3s" repeatCount="indefinite" path="M205 100Q240 100 275 82" keyPoints="0;0;1;1" keyTimes="0;0.0;1.0;1" calcMode="linear"/><animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0;0.001;1"/></circle></g><g data-h="2" tabindex="0" role="button" aria-label="InfluxDB"><rect class="n" x="222" y="120" width="80" height="36" rx="8"/><text class="t" x="262.0" y="142.0">InfluxDB</text></g><g data-h="3" tabindex="0" role="button" aria-label="Elasticsearch"><rect class="n" x="312" y="120" width="80" height="36" rx="8"/><text class="t" x="352.0" y="137.0">Elastic</text><text class="s" x="352.0" y="149.0">{ JSON }</text></g></svg>